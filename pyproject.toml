[project]
name = "interview-simulator"
version = "0.1.0"
description = "Interview Coach: interview practice with a local Qwen model, Jev and Claude."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.141",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.47",
    "typesafe-sdk==0.7.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.llm.*", "app.judgments.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls a real provider; needs API keys / a running Ollama (run with -m live)"]
addopts = "-m 'not live'"
