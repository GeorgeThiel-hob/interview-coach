[project]
name = "interview-simulator"
version = "0.1.0"
description = "Interview Coach: interview practice with a local Qwen model, Jev and Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8,<2",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141",
    "httpx>=0.28",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.47",
    "typesafe-sdk==0.7.2",
    "uvicorn>=0.32",
    "weasyprint>=70.0",
]

[project.scripts]
coach = "app.cli:main"

[dependency-groups]
# Optional: spoken answers (M5). Heavy (CTranslate2); only needed where speech is used.
speech = ["faster-whisper>=1.1"]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; RUF001: regexes intentionally match Unicode dashes/spaces
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.llm.*", "app.judgments.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: calls a real provider; needs API keys / a running Ollama (run with -m live)",
  "snapshot: writes design/snapshots/ (run with make snapshots)",
]
addopts = "-m 'not live and not snapshot'"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
