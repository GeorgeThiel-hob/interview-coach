{% extends "base.html" %}
{% block content %}
<div class="auth">
  <div class="card raised">
    <h1>{{ t('login') }}</h1>
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">{{ t('username') }}</label><input id="username" type="text" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="password">{{ t('password') }}</label><input id="password" type="password" name="password" required autocomplete="current-password">
      <div class="actions" style="margin-top:var(--s6)"><button class="lg" style="width:100%">{{ t('login') }}</button></div>
    </form>
  </div>
  <p class="small muted" style="padding:0 var(--s4)">{{ t('invite_only') }} <a href="/register">{{ t('register') }}</a></p>
</div>
{% endblock %}
