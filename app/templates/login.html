{% extends "base.html" %}
{% block content %}
<div class="card">
<h1>{{ t('login') }}</h1>
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="email">{{ t('email') }}</label><input id="email" type="email" name="email" required autocomplete="username">
  <label for="password">{{ t('password') }}</label><input id="password" type="password" name="password" required autocomplete="current-password">
  <p><button>{{ t('login') }}</button></p>
</form>
<p class="muted small">Invite-only. <a href="/register">{{ t('register') }}</a></p>
</div>
{% endblock %}
