{% extends "base.html" %}
{% block content %}
{% if not local_ok %}<div class="alert">{{ t('local_offline') }}</div>{% endif %}
<form class="card" method="post" action="/runs" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <h1>{{ t('new_run') }}</h1>
  <label for="vacancy_file">{{ t('vacancy') }} (PDF, DOCX, TXT)</label>
  <input id="vacancy_file" type="file" name="vacancy_file" accept=".pdf,.docx,.txt,.md">
  <label for="vacancy_text" class="muted small">{{ t('or_paste') }}</label>
  <textarea id="vacancy_text" name="vacancy_text" rows="4"></textarea>
  <label for="cv_file">{{ t('cv') }} (PDF, DOCX)</label>
  <input id="cv_file" type="file" name="cv_file" accept=".pdf,.docx,.txt,.md" required>
  <label for="previous_file">{{ t('previous_report') }}</label>
  <input id="previous_file" type="file" name="previous_file" accept=".json,.pdf">
  <label for="extra_file">{{ t('extra') }}</label>
  <input id="extra_file" type="file" name="extra_file" accept=".pdf,.docx,.txt,.md">
  <h2 style="margin-top:1.2rem">{{ t('settings') }}</h2>
  <div class="row">
    <div><label for="interview_type">{{ t('interview_type') }}</label>
      <select id="interview_type" name="interview_type">{% for v in ['intake','client','mixed'] %}<option value="{{ v }}" {% if v == 'mixed' %}selected{% endif %}>{{ t(v) }}</option>{% endfor %}</select></div>
    <div><label for="language">{{ t('language') }}</label>
      <select id="language" name="language"><option value="nl">Nederlands</option><option value="en">English</option></select></div>
    <div><label for="length">{{ t('length') }}</label>
      <select id="length" name="length"><option>15</option><option selected>30</option><option>45</option></select></div>
    <div><label for="answer_mode">{{ t('answer_mode') }}</label>
      <select id="answer_mode" name="answer_mode"><option value="typed">{{ t('typed') }}</option><option value="spoken">{{ t('spoken') }}</option></select></div>
    <div><label for="difficulty">{{ t('difficulty') }}</label>
      <select id="difficulty" name="difficulty">{% for v in ['friendly','realistic','critical'] %}<option value="{{ v }}" {% if v == 'realistic' %}selected{% endif %}>{{ t(v) }}</option>{% endfor %}</select></div>
  </div>
  <p style="margin-top:1rem"><button {% if not local_ok %}disabled{% endif %}>{{ t('start') }}</button></p>
  <p class="muted small">{{ t('privacy_note') }}</p>
</form>
{% endblock %}
