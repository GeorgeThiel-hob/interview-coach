{% extends "base.html" %}
{% block content %}
<div class="auth">
  <div class="card raised">
    <h1>{{ t('register') }}</h1>
    <form method="post" action="/register">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="code">{{ t('invite_code') }}</label><input id="code" type="text" name="code" value="{{ code }}" required>
      <label for="username">{{ t('username') }}</label><input id="username" type="text" name="username" required minlength="3" maxlength="40" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="user-hint">
      <p id="user-hint" class="small muted" style="margin:.4rem 0 0">{{ t('username_hint') }}</p>
      <label for="password">{{ t('password') }}</label><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password" aria-describedby="pw-hint">
      <p id="pw-hint" class="small muted" style="margin:.4rem 0 0">{{ t('password_hint') }}</p>
      <div class="actions" style="margin-top:var(--s6)"><button class="lg" style="width:100%">{{ t('register') }}</button></div>
    </form>
  </div>
</div>
{% endblock %}
