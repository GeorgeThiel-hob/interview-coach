{% extends "base.html" %}
{% block content %}
<div class="card">
<h1>{{ t('register') }}</h1>
<form method="post" action="/register">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">{{ t('invite_code') }}</label><input id="code" type="text" name="code" value="{{ code }}" required>
  <label for="email">{{ t('email') }}</label><input id="email" type="email" name="email" required autocomplete="username">
  <label for="password">{{ t('password') }}</label><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password">
  <p><button>{{ t('register') }}</button></p>
</form>
</div>
{% endblock %}
