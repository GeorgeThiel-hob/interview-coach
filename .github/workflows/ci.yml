name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest -q

  eval-subset:
    # Runs only when prompts, catalog or thresholds change, and only if the repo has the
    # TYPESAFE_API_KEY secret (costs a fraction of a cent per run).
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(prompts/|config/thresholds.yaml|app/judgments/|eval/set/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: eval subset
        if: steps.changed.outputs.run == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "no TYPESAFE_API_KEY secret; skipping"; exit 0; fi
          uv sync --locked
          uv run python scripts/run_eval.py --subset 10
