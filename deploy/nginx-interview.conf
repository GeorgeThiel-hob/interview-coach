# Second site on the server's existing nginx. INTERVIEW_DOMAIN is your (sub)domain, e.g.
# my-interview.duckdns.org. Install it with deploy/nginx-site.sh <domain> (as root), which fills
# in the domain, gets the certificate first and only reloads nginx after `nginx -t` passes.
server {
    listen 80;
    listen [::]:80;
    server_name INTERVIEW_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name INTERVIEW_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/INTERVIEW_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/INTERVIEW_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 30m;   # 5 files of max 10 MB are uploaded one form at a time

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # answers wait for the local model
    }
    location ~ ^/runs/[0-9a-f]+/events$ {   # server-sent events: no buffering
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
